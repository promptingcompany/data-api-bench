name: snapshot
on: workflow_dispatch
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build/pricing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Where this runner is
        run: curl -s https://ipinfo.io/json | tee vantage.json
      - name: Capture pricing pages
        run: |
          mkdir -p out/html out/text
          cp vantage.json out/
          date -u +%Y-%m-%dT%H:%M:%SZ > out/captured_at.txt
          tr '|' ' ' < urls.txt | xargs -P 6 -n 2 ./snap.sh | sort | tee out/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot
          path: build/pricing/out/
